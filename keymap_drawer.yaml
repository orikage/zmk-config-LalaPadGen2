draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30
  combo_w: 28
  combo_h: 26
  footer_text: "LalaPad Gen2 — generated by <a href='https://github.com/caksoylar/keymap-drawer'>keymap-drawer</a>"
  svg_extra_style: |
    svg { background: #1a1a2e; }
    .label { fill: #e0e0e0; }
    .key { fill: #2a2a4a; stroke: #5555aa; }
    .held { fill: #3a2a5a; stroke: #7755aa; }
    .ghost { fill: #1a1a2e; stroke: #333366; }
    .combo { fill: #1a3a2a; stroke: #335533; }

parse_config:
  zmk_keycode_map:
    INT4: "かな"
    INT5: "英数"
    LG(TAB): "⊞+Tab"
    LG(D): "⊞+D"
    LC(LG(LEFT)): "⊞←"
    LC(LG(RIGHT)): "⊞→"
    LWIN: "⊞"
    EXCLAMATION: "!"
    AT_SIGN: "@"
    HASH: "#"
    DOLLAR: "$"
    PERCENT: "%"
    CARET: "^"
    AMPERSAND: "&"
    ASTERISK: "*"
    LEFT_PARENTHESIS: "("
    RIGHT_PARENTHESIS: ")"
    GRAVE: "`"
    SQT: "'"
    COLON: ":"
    SEMI: ";"
    LEFT_BRACKET: "["
    RIGHT_BRACKET: "]"
    LEFT_BRACE: "{"
    RIGHT_BRACE: "}"
    PIPE: "|"
    TILDE: "~"
    UNDERSCORE: "_"
    LESS_THAN: "<"
    GREATER_THAN: ">"
    PLUS: "+"
    EQUAL: "="
    QUESTION: "?"
    KP_ASTERISK: "KP *"
    KP_PLUS: "KP +"
    KP_MINUS: "KP -"
    KP_DOT: "KP ."
    KP_DIVIDE: "KP /"
  zmk_preamble: |
    #define DEFAULT_LAYER   0
    #define SECONDARY_LAYER 1
    #define TERTIARY_LAYER  2
    #define SYSTEM_LAYER    3
