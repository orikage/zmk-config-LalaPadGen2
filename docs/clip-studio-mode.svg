<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1372" viewBox="0 0 1080 1372" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="48" font-size="26" fill="#222" text-anchor="start" font-weight="bold">クリスタモード（CLIP STUDIO PAINT）左手配置</text><text x="30" y="78" font-size="14" fill="#555" text-anchor="start">左親指 Win+Alt 同時押しで ON/OFF（ONにすると自動でIMEオフ）／ 上段: 機能名　下段: 送信キー（WindowsはJIS配列前提）</text><text x="30" y="130" font-size="18" fill="#222" text-anchor="start" font-weight="bold">① メイン（クリスタモードON中）</text><rect x="30" y="146" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="78.0" y="192.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">縮小</text><text x="78.0" y="216.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+テンキー−</text><rect x="132" y="146" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="180.0" y="192.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">拡大</text><text x="180.0" y="216.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+テンキー＋</text><rect x="234" y="146" width="96" height="96" rx="10" fill="#ffe9c7" stroke="#d35400" stroke-width="2"/><text x="282.0" y="192.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">ブラシ小</text><text x="282.0" y="216.0" font-size="13" fill="#d35400" text-anchor="middle">[</text><rect x="336" y="146" width="96" height="96" rx="10" fill="#ffe9c7" stroke="#d35400" stroke-width="2"/><text x="384.0" y="192.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">ブラシ大</text><text x="384.0" y="216.0" font-size="13" fill="#d35400" text-anchor="middle">]</text><rect x="438" y="146" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="486.0" y="192.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">全体表示</text><text x="486.0