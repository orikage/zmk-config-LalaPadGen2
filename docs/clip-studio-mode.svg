anchor="middle">色入替</text><text x="180.0" y="420.0" font-size="13" fill="#777777" text-anchor="middle">X</text><rect x="234" y="350" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="282.0" y="396.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">レイヤー移動</text><text x="282.0" y="420.0" font-size="13" fill="#2c6fbb" text-anchor="middle">K</text><rect x="336" y="350" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="384.0" y="396.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">塗りつぶし</text><text x="384.0" y="420.0" font-size="13" fill="#2c6fbb" text-anchor="middle">G</text><rect x="438" y="350" width="96" height="96" rx="10" fill="#fff6cc" stroke="#b8860b" stroke-width="2"/><text x="486.0" y="396.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">左右反転</text><text x="486.0" y="420.0" font-size="10.5" fill="#b8860b" text-anchor="middle">Ctrl+Shift+Alt+H</text><rect x="30" y="452" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="78.0" y="498.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">Ctrl</text><text x="78.0" y="522.0" font-size="13" fill="#2e8b57" text-anchor="middle">修飾キー</text><rect x="132" y="452" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="180.0" y="498.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">やり直し</text><text x="180.0" y="522.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+Y</text><rect x="234" y="452" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="282.0" y="498.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">Alt</text><text x="282.0" y="522.0" font-size="13" fill="#2e8b57" text-anchor="middle">修飾キー</text><rect x="336" y="452" width="96" height="96" rx="10" fill="#ffd6d6" stroke="#c0392b" stroke-width="2"/><text x="384.0" y="498.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">取り消し</text><text x="384.0" y="522.0" font-size="13" fill="#c0392b" text-anchor="middle">長押し:サブ</text><rect x="438" y="452" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="486.0" y="498.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Space</text><text x="486.0" y="522.0" font-size="13" fill="#2e8b57" text-anchor="middle">手のひら</text><rect x="560" y="452" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="608.0" y="498.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Shift</text><text x="608.0" y="522.0" font-size="13" fill="#2e8b57" text-anchor="middle">修飾キー</text><path d="M180 558 v14 h102 v-14" fill="none" stroke="#7d3cc8" stroke-width="2"/><text x="231" y="592" font-size="14" fill="#7d3cc8" text-anchor="middle" font-weight="bold">2つ同時押しでクリスタモード ON/OFF</text><rect x="361" y="607" width="78" height="78" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="400.0" y="644.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">変形</text><text x="400.0" y="668.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+T</text><rect x="361" y="771" width="78" height="78" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="400.0" y="808.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">選択解除</text><text x="400.0" y="832.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+D</text><rect x="279" y="689" width="78" height="78" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="318.0" y="726.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">消去</text><text x="318.0" y="750.0" font-size="13" fill="#777777" text-anchor="middle">Delete</text><rect x="443" y="689" width="78" height="78" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="482.0" y="726.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">保存</text><text x="482.0" y="750.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+S</text><rect x="361" y="689" width="78" height="78" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="400.0" y="726.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">表示リセット</text><text x="400.0" y="750.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+@</text><text x="30" y="722" font-size="16" fill="#333" text-anchor="start">左の十字キー</text><text x="30" y="746" font-size="13" fill="#666" text-anchor="start">（固いので使用頻度の低い操作）</text><text x="30" y="766" font-size="13" fill="#666" text-anchor="start">中央押し = 表示リセット</text><rect x="640" y="608" width="240" height="240" rx="18" fill="#f7f7fb" stroke="#999" stroke-width="2"/><text x="760" y="596" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">左トラックパッドの3本指スワイプ</text><text x="760" y="648" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">↑ 上のレイヤーを選択</text><text x="760" y="666" font-size="13" fill="#2c6fbb" text-anchor="middle">Alt+]</text><text x="760" y="822" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">↓ 下のレイヤーを選択</text><text x="760" y="840" font-size="13" fill="#2c6fbb" text-anchor="middle">Alt+[</text><text x="654" y="724" font-size="14" fill="#222" text-anchor="start" font-weight="bold">← 左回転</text><text x="654" y="742" font-size="13" fill="#2c6fbb" text-anchor="start">-</text><text x="866" y="724" font-size="14" fill="#222" text-anchor="end" font-weight="bold">右回転 →</text><text x="866" y="742" font-size="13" fill="#2c6fbb" text-anchor="end">^</text><text x="760" y="870" font-size="12" fill="#666" text-anchor="middle">タップ=クリック・ピンチ=Ctrl は通常どおり</text><rect x="700" y="146" width="24" height="24" rx="5" fill="#ffd6d6" stroke="#c0392b" stroke-width="2"/><text x="734" y="164" font-size="15" fill="#333" text-anchor="start">最優先（親指・ホーム段 人差し指/中指）</text><rect x="700" y="180" width="24" height="24" rx="5" fill="#ffe9c7" stroke="#d35400" stroke-width="2"/><text x="734" y="198" font-size="15" fill="#333" text-anchor="start">よく使う</text><rect x="700" y="214" width="24" height="24" rx="5" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="734" y="232" font-size="15" fill="#333" text-anchor="start">ときどき使う</text><rect x="700" y="248" width="24" height="24" rx="5" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="734" y="266" font-size="15" fill="#333" text-anchor="start">たまに使う</text><rect x="700" y="282" width="24" height="24" rx="5" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="734" y="300" font-size="15" fill="#333" text-anchor="start">修飾キー（ペン操作と組み合わせ）</text><rect x="700" y="316" width="24" height="24" rx="5" fill="#efe3ff" stroke="#7d3cc8" stroke-width="2"/><text x="734" y="334" font-size="15" fill="#333" text-anchor="start">押している間サブレイヤー</text><rect x="700" y="350" width="24" height="24" rx="5" fill="#fff6cc" stroke="#b8860b" stroke-width="2"/><text x="734" y="368" font-size="15" fill="#333" text-anchor="start">クリスタ側で要ショートカット登録</text><text x="700" y="408" font-size="14" fill="#555" text-anchor="start">・右手側のキーは通常どおり</text><text x="700" y="432" font-size="14" fill="#555" text-anchor="start">・Space+ドラッグ: 手のひら</text><text x="700" y="456" font-size="14" fill="#555" text-anchor="start">・Shift+Space+ドラッグ: 自由回転</text><text x="700" y="480" font-size="14" fill="#555" text-anchor="start">・Ctrl+Alt+ドラッグ: ブラシサイズ</text><text x="700" y="504" font-size="14" fill="#555" text-anchor="start">・Alt+クリック: スポイト</text><text x="700" y="528" font-size="14" fill="#555" text-anchor="start">・Shift+ドラッグ: 直線</text><line x1="30" y1="878" x2="1050" y2="878" stroke="#ccc" stroke-width="2"/><text x="30" y="918" font-size="18" fill="#222" text-anchor="start" font-weight="bold">② サブレイヤー（「取り消し」の親指を押している間）</text><rect x="30" y="934" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="78.0" y="980.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">100%表示</text><text x="78.0" y="1004.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+Alt+0</text><rect x="132" y="934" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="180.0" y="980.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">自由変形</text><text x="180.0" y="1004.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+Shift+T</text><rect x="234" y="934" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="282.0" y="980.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">不透明度−</text><text x="282.0" y="1004.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+[</text><rect x="336" y="934" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="384.0" y="980.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">不透明度＋</text><text x="384.0" y="1004.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+]</text><rect x="438" y="934" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="486.0" y="980.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">テキスト</text><text x="486.0" y="1004.0" font-size="13" fill="#777777" text-anchor="middle">T</text><rect x="30" y="1036" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="78.0" y="1082.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">新規ラスター</text><text x="78.0" y="1106.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+Shift+N</text><rect x="132" y="1036" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="180.0" y="1082.0" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">新規フォルダー</text><text x="180.0" y="1106.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+G</text><rect x="234" y="1036" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="282.0" y="1082.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">クリッピング</text><text x="282.0" y="1106.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+Alt+G</text><rect x="336" y="1036" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="384.0" y="1082.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">下に結合</text><text x="384.0" y="1106.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+E</text><rect x="438" y="1036" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="486.0" y="1082.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">自動選択</text><text x="486.0" y="1106.0" font-size="13" fill="#2c6fbb" text-anchor="middle">W</text><rect x="30" y="1138" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="78.0" y="1184.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">全選択</text><text x="78.0" y="1208.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+A</text><rect x="132" y="1138" width="96" height="96" rx="10" fill="#e3f0ff" stroke="#2c6fbb" stroke-width="2"/><text x="180.0" y="1184.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">切り取り</text><text x="180.0" y="1208.0" font-size="13" fill="#2c6fbb" text-anchor="middle">Ctrl+X</text><rect x="234" y="1138" width="96" height="96" rx="10" fill="#ffe9c7" stroke="#d35400" stroke-width="2"/><text x="282.0" y="1184.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">コピー</text><text x="282.0" y="1208.0" font-size="13" fill="#d35400" text-anchor="middle">Ctrl+C</text><rect x="336" y="1138" width="96" height="96" rx="10" fill="#ffe9c7" stroke="#d35400" stroke-width="2"/><text x="384.0" y="1184.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">貼り付け</text><text x="384.0" y="1208.0" font-size="13" fill="#d35400" text-anchor="middle">Ctrl+V</text><rect x="438" y="1138" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="486.0" y="1184.0" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">選択範囲反転</text><text x="486.0" y="1208.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+Shift+I</text><rect x="30" y="1240" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="78.0" y="1286.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">Ctrl</text><text x="78.0" y="1310.0" font-size="13" fill="#2e8b57" text-anchor="middle">修飾キー</text><rect x="132" y="1240" width="96" height="96" rx="10" fill="#eeeeee" stroke="#777777" stroke-width="2"/><text x="180.0" y="1286.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">やり直し</text><text x="180.0" y="1310.0" font-size="13" fill="#777777" text-anchor="middle">Ctrl+Y</text><rect x="234" y="1240" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="282.0" y="1286.0" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">Alt</text><text x="282.0" y="1310.0" font-size="13" fill="#2e8b57" text-anchor="middle">修飾キー</text><rect x="336" y="1240" width="96" height="96" rx="10" fill="#efe3ff" stroke="#7d3cc8" stroke-width="2"/><text x="384.0" y="1286.0" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">（押し続ける）</text><text x="384.0" y="1310.0" font-size="13" fill="#7d3cc8" text-anchor="middle"></text><rect x="438" y="1240" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="486.0" y="1286.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Space</text><text x="486.0" y="1310.0" font-size="13" fill="#2e8b57" text-anchor="middle">手のひら</text><rect x="560" y="1240" width="96" height="96" rx="10" fill="#e6f5e6" stroke="#2e8b57" stroke-width="2"/><text x="608.0" y="1286.0" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Shift</text><text x="608.0" y="1310.0" font-size="13" fill="#2e8b57" text-anchor="middle">修飾キー</text><text x="620" y="974" font-size="14" fill="#555" text-anchor="start">コピー/貼り付け/切り取りは Ctrl+C/V/X の</text><text x="620" y="998" font-size="14" fill="#555" text-anchor="start">いつもの指の位置（下段）にそろえています</text><text x="620" y="1022" font-size="14" fill="#555" text-anchor="start"></text><text x="620" y="1046" font-size="14" fill="#555" text-anchor="start">親指の Ctrl と組み合わせる必要がないので、</text><text x="620" y="1070" font-size="14" fill="#555" text-anchor="start">メイン側の「Ctrl+文字」誤爆も起きません</text></svg>